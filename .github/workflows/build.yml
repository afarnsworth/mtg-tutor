name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly data refresh, Thursdays 22:41 UTC: fresh for Friday and the weekend.
    # Runs after Scryfall's ~21:00 UTC bulk file update.
    - cron: '41 22 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The site and image are published only from the default branch (pushes, the weekly run, manual runs).
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run data
      - run: npm run build

      - name: Image name and content hash
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mtg-tutor" >> "$GITHUB_OUTPUT"
          # Everything that ends up in the image. Identical content gets an identical tag.
          hash=$(find dist nginx Dockerfile -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "tag=content-$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If nothing changed since the last published image, don't push a new
      # :latest; Watchtower would restart the container for no reason.
      - name: Check for an identical published image
        id: existing
        if: env.PUBLISH == 'true'
        run: |
          if docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" > /dev/null 2>&1; then
            echo "Image ${{ steps.meta.outputs.tag }} already published; skipping push."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # The Dockerfile only copies files, so multi-arch builds need no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' && steps.existing.outputs.found != 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Offline MTG card lookup PWA

      # GitHub Pages serves files as-is and compresses on its own, so leave out the .gz copies.
      - name: Prepare Pages site
        if: env.PUBLISH == 'true'
        run: mkdir _site && tar -C dist --exclude='*.gz' -cf - . | tar -C _site -xf -

      - uses: actions/upload-pages-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          path: _site

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
