# Included in every location: add_header in a location replaces, rather than
# extends, headers set at server level.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://cards.scryfall.io; connect-src 'self' https://cards.scryfall.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
