# Static server for the built app. TLS, hostnames and any reverse proxy or
# tunnel belong to the deployment, not this repo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind a proxy, don't build redirects from the container's own host/port.
    absolute_redirect off;

    # Serve the .gz files written at build time; compress anything else on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css;

    # Content-hashed files never change.
    location /assets/ {
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry points: always revalidate so new app and data versions are seen promptly.
    location = /index.html {
        include snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        include snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Icons and anything else unhashed.
    location / {
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }
}
